name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  # Gate for every build and every release: the version has one source
  # (VERSION), matches the tag, and all plugins lint clean.
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: zip

      - name: VERSION matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$tag VERSION=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match VERSION ($version)"
            exit 1
          fi

      # Fails if any version carrier (WC header + ANEEPAY_VERSION,
      # OC install.xml, PS $this->version) diverges from VERSION, and runs
      # php -l over all plugins. Nothing is packaged here.
      - name: Version sources and lint
        run: ./scripts/pack.sh check

      # TODO(v2): add phpstan (level 6) + phpcs (PSR-12) here. They need stubs
      # for the WordPress, OpenCart and PrestaShop APIs and stay inside this job
      # so a release can never skip them. The unit tests live in `test` below.

  # Unit tests on the oldest and the newest PHP the plugins claim to support
  # (VERSION is shared, so one matrix covers all three plugins). Lint runs with
  # the matrix PHP too: syntax that only parses on 8.x would otherwise slip
  # through the single 8.2 lint in `verify`.
  test:
    name: test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          coverage: none
          tools: composer:v2

      # composer.lock is not committed (the plugins ship no vendor/), so the
      # cache is keyed by composer.json and only saves the download cache.
      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Version sources and lint
        run: ./scripts/pack.sh check

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Unit tests
        run: composer test

  pack:
    name: pack (${{ matrix.platform }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [wc, oc, ps]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: zip

      - name: Pack plugin
        run: ./scripts/pack.sh ${{ matrix.platform }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, test, pack]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: zip

      - name: Pack all platforms
        run: ./scripts/pack.sh all

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/wc/aneepay.zip
            dist/oc/aneepay-*.ocmod.zip
            dist/ps/ps_aneepay.zip
            dist/SHA256SUMS
